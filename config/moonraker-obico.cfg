# moonraker-obico configuration for the Centauri bridge.
# Generated by ./install.sh. You normally do not need to edit this by hand.
#
# The [server] auth_token is written automatically the first time you link
# the printer to your Obico account (see the README).

[server]
url = __OBICO_SERVER_URL__
# auth_token = <filled in automatically during linking>

[moonraker]
# The bridge runs on the same host and publishes Moonraker on port 7125.
host = 127.0.0.1
port = 7125
api_key = centauri-bridge

[webcam]
disable_video_streaming = False

[logging]
path = /opt/printer_data/logs/moonraker-obico.log
level = INFO
